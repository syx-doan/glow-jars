<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="ad.orientation" content="portrait,landscape">
<title>Glow Jars</title>
<script type="text/javascript" src="https://tpc.googlesyndication.com/pagead/gadgets/html5/api/exitapi.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #07060f;
  color: #f3eee4;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(900px 520px at 50% -10%, #2a1b3d 0%, transparent 60%),
    radial-gradient(700px 500px at 110% 85%, #12332e 0%, transparent 55%),
    #07060f;
}
button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
#top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(20, 17, 29, 0.78);
  border-bottom: 1px solid rgba(243, 238, 228, 0.12);
}
#icon { width: 44px; height: 44px; border-radius: 11px; box-shadow: 0 0 14px rgba(228, 194, 122, 0.35); }
.brand { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.brand b { font-size: 17px; letter-spacing: 0.02em; }
.brand span { font-size: 12px; color: #a59fb3; }
.cta {
  background: #e4c27a;
  color: #1a140c;
  font-weight: 800;
  letter-spacing: 0.05em;
  border-radius: 999px;
  box-shadow: 0 3px 0 #9a7438, 0 0 18px rgba(228, 194, 122, 0.45);
  animation: pulse 1.6s ease-in-out 6;
}
.cta:active { transform: translateY(2px) scale(0.97); box-shadow: 0 1px 0 #9a7438; }
#cta-top { padding: 10px 16px; font-size: 14px; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
#caption {
  text-align: center;
  font-size: clamp(15px, 4.2vw, 20px);
  font-weight: 700;
  line-height: 1.3;
  padding: 14px 18px 2px;
  min-height: 50px;
  text-shadow: 0 0 14px rgba(228, 194, 122, 0.45);
}
#stage { position: relative; flex: 1; min-height: 0; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
#bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px 16px; }
.ghost {
  background: rgba(20, 17, 29, 0.72);
  border: 1px solid rgba(243, 238, 228, 0.16);
  border-radius: 999px;
  padding: 9px 16px;
  font-size: 14px;
}
.ghost:active { transform: translateY(2px) scale(0.97); }
#moves {
  color: #e4c27a;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
#end {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(5, 4, 10, 0.74);
  z-index: 5;
}
#end.hidden { display: none; }
.card {
  width: min(360px, 100%);
  text-align: center;
  background: #16131f;
  border: 1px solid rgba(243, 238, 228, 0.14);
  border-radius: 24px;
  padding: 24px 20px 18px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(126, 224, 198, 0.12);
  animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1);
}
@keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.card img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 0 22px rgba(228, 194, 122, 0.4); }
#end-kicker { margin-top: 12px; color: #7ee0c6; font-size: 13px; font-weight: 800; letter-spacing: 0.18em; }
#end-stars { color: #e4c27a; font-size: 30px; letter-spacing: 8px; margin: 6px 0 2px; }
#end-title { font-size: 22px; margin: 6px 0 8px; }
#end-body { color: #a59fb3; font-size: 14px; line-height: 1.45; }
#cta-end { display: block; width: 100%; margin-top: 18px; padding: 15px; font-size: 18px; }
#again { margin-top: 12px; }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <img id="icon" src="icon.png" alt="Glow Jars">
    <div class="brand"><b>Glow Jars</b><span id="sub">Color sort puzzle</span></div>
    <button class="cta" id="cta-top" type="button">INSTALL</button>
  </header>
  <p id="caption">Tap a jar, then tap another to pour</p>
  <div id="stage"><canvas id="board"></canvas></div>
  <footer id="bar">
    <button class="ghost" id="restart" type="button">Restart</button>
    <span id="moves">Moves 0</span>
  </footer>
  <div id="end" class="hidden">
    <div class="card">
      <img src="icon.png" alt="">
      <p id="end-kicker">LEVEL CLEAR</p>
      <div id="end-stars"></div>
      <h2 id="end-title"></h2>
      <p id="end-body"></p>
      <button class="cta" id="cta-end" type="button">PLAY FREE</button>
      <button class="ghost" id="again" type="button">Play again</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";

  var CAP = 4;
  // Picked by scripts/playable-level.mjs: 10 optimal moves, ~26% dead-end states, none within 4 moves.
  var LEVEL = [[4, 2, 2, 3], [1, 2, 3, 4], [1, 4, 4, 1], [3, 3, 1, 2], []];
  var OPTIMAL = 10;
  var COLORS = ["#ff5d7a", "#ffd166", "#2ee9a6", "#4cc9f0"];

  var TEXT = {
    en: {
      sub: "Color sort puzzle",
      install: "INSTALL",
      c0: "Tap a jar, then tap another to pour",
      c1: "Same colors stack. Fill a jar to seal it!",
      c2: "Nice! Use the empty jar wisely",
      sealed: "SEALED!",
      combo: "COMBO x",
      moves: "Moves ",
      restart: "Restart",
      winKicker: "LEVEL CLEAR",
      winTitle: "You've got the glow!",
      winBody: "80 levels of ice, hidden gems and combos are waiting.",
      stuckKicker: "PUZZLE STUCK",
      stuckTitle: "So close!",
      stuckBody: "Plan ahead. The full game has hints, undo and extra jars.",
      play: "PLAY FREE",
      again: "Play again",
      retry: "Try again"
    },
    vi: {
      sub: "Xếp bóng theo màu",
      install: "CÀI ĐẶT",
      c0: "Chạm 1 lọ, rồi chạm lọ khác để đổ bóng",
      c1: "Bóng cùng màu chồng lên nhau. Đầy 1 màu là khóa nắp!",
      c2: "Tuyệt! Dùng lọ trống thật khéo",
      sealed: "KHÓA!",
      combo: "COMBO x",
      moves: "Nước đi ",
      restart: "Chơi lại",
      winKicker: "HOÀN THÀNH",
      winTitle: "Bạn bắt được ánh sáng rồi!",
      winBody: "80 màn với băng, ngọc ẩn và combo đang chờ bạn.",
      stuckKicker: "BỊ KẸT RỒI",
      stuckTitle: "Suýt nữa rồi!",
      stuckBody: "Tính trước nước đi nhé. Bản đầy đủ có gợi ý, hoàn tác và thêm lọ.",
      play: "CHƠI MIỄN PHÍ",
      again: "Chơi lại",
      retry: "Thử lại"
    }
  };
  var L = /^vi/i.test(navigator.language || "") ? TEXT.vi : TEXT.en;

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $("board");
  var ctx = canvas.getContext("2d");

  var jars, selected, anim, moves, sealedCount, combo, ended, lastInput, hintCache, rects, metrics;
  var particles = [];
  var popups = [];
  var shake = { i: -1, until: 0 };
  var drag = null;
  var stars = [];
  for (var s = 0; s < 46; s++) stars.push({ x: Math.random(), y: Math.random(), r: Math.random() < 0.3 ? 1.6 : 1, p: Math.random() * 6 });

  function install() {
    if (window.ExitApi && typeof window.ExitApi.exit === "function") window.ExitApi.exit();
  }

  // ---- rules (mirror src/engine.ts) ----
  function topRun(j) {
    var n = 0;
    for (var i = j.length - 1; i >= 0 && j[i] === j[j.length - 1]; i--) n++;
    return n;
  }
  function isSealed(j) { return j.length === CAP && topRun(j) === CAP; }
  function isSolved(js) { return js.every(function (j) { return !j.length || isSealed(j); }); }
  function amount(js, a, b) {
    var src = js[a], dst = js[b];
    if (a === b || !src.length || dst.length >= CAP || isSealed(src)) return 0;
    var run = topRun(src);
    var color = src[src.length - 1];
    if (dst.length && dst[dst.length - 1] !== color) return 0;
    if (!dst.length && run === src.length) return 0;
    return Math.min(run, CAP - dst.length);
  }
  function clone(js) { return js.map(function (j) { return j.slice(); }); }
  function key(js) { return js.map(function (j) { return j.join(""); }).join("|"); }

  /** Shortest path from the current state: first move, or null when no win is reachable. */
  function solve(js) {
    var k0 = key(js);
    if (hintCache && hintCache.key === k0) return hintCache.res;
    var first = {};
    first[k0] = null;
    var queue = [js];
    var res = null;
    for (var qi = 0; qi < queue.length && qi < 6000; qi++) {
      var cur = queue[qi];
      var k = key(cur);
      if (isSolved(cur)) { res = { move: first[k] }; break; }
      for (var a = 0; a < cur.length; a++) {
        for (var b = 0; b < cur.length; b++) {
          var n = amount(cur, a, b);
          if (!n) continue;
          var next = clone(cur);
          for (var t = 0; t < n; t++) next[b].push(next[a].pop());
          var nk = key(next);
          if (nk in first) continue;
          first[nk] = first[k] || [a, b];
          queue.push(next);
        }
      }
    }
    hintCache = { key: k0, res: res };
    return res;
  }

  // ---- layout ----
  function layout(w, h) {
    var n = jars.length;
    var land = w > h * 1.15;
    var cols = land ? n : 3;
    var rows = Math.ceil(n / cols);
    var gapX = Math.min(30, w * 0.06);
    var jarW = Math.min(92, (w - 32 - gapX * (cols - 1)) / cols);
    var jarH = jarW * 2.55;
    var gapY = jarH * 0.16;
    var total = rows * jarH + (rows - 1) * gapY;
    var room = h - 28;
    if (total > room) {
      var k = room / total;
      jarW *= k; jarH *= k; gapY *= k; gapX *= k;
      total = rows * jarH + (rows - 1) * gapY;
    }
    var list = [];
    for (var i = 0; i < n; i++) {
      var row = Math.floor(i / cols);
      var inRow = Math.min(cols, n - row * cols);
      var col = i - row * cols;
      var rowW = inRow * jarW + (inRow - 1) * gapX;
      list.push({
        x: (w - rowW) / 2 + col * (jarW + gapX),
        y: (h - total) / 2 + row * (jarH + gapY) + 8,
        w: jarW,
        h: jarH
      });
    }
    return { rects: list, orb: jarW * 0.27 };
  }

  function slotY(r, slot, orb) { return r.y + r.h - r.w * 0.1 - orb - slot * orb * 2.06; }

  function jarAt(x, y, pad) {
    pad = pad || 0;
    for (var i = 0; i < rects.length; i++) {
      var r = rects[i];
      if (x >= r.x - 10 - pad && x <= r.x + r.w + 10 + pad && y >= r.y - 24 - pad && y <= r.y + r.h + 10 + pad) return i;
    }
    return null;
  }

  // ---- drawing ----
  function shade(hex, pct) {
    var n = parseInt(hex.slice(1), 16);
    var f = function (c) { return Math.max(0, Math.min(255, Math.round(c + (pct / 100) * 255))); };
    return "rgb(" + f((n >> 16) & 255) + "," + f((n >> 8) & 255) + "," + f(n & 255) + ")";
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawOrb(x, y, color, r, glow) {
    var hex = COLORS[color - 1];
    ctx.save();
    ctx.shadowColor = hex;
    ctx.shadowBlur = glow ? 24 : 12;
    var g = ctx.createRadialGradient(x - r * 0.25, y - r * 0.3, r * 0.1, x, y, r);
    g.addColorStop(0, "#fff6");
    g.addColorStop(0.35, hex);
    g.addColorStop(1, shade(hex, -40));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.beginPath();
    ctx.ellipse(x - r * 0.28, y - r * 0.34, r * 0.22, r * 0.12, -0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawJar(i, now, hint, hideTop) {
    var r = rects[i];
    var jar = jars[i];
    var orb = metrics.orb;
    var sel = selected === i;
    var sealed = isSealed(jar);
    var x = r.x;
    if (shake.i === i && now < shake.until) x += Math.sin(now / 18) * 5;
    ctx.save();
    if (sel) ctx.translate(0, -(6 + Math.sin(now / 180) * 1.5));
    var radius = Math.max(8, r.w * 0.2);

    if (hint) {
      ctx.strokeStyle = "rgba(228,194,122,0.9)";
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      roundRect(x - 6, r.y - 8, r.w + 12, r.h + 14, radius + 4);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.fillStyle = sealed ? "rgba(126,224,198,0.13)" : "rgba(255,255,255,0.05)";
    ctx.strokeStyle = sel ? "rgba(228,194,122,0.95)" : "rgba(255,255,255,0.3)";
    ctx.lineWidth = sel ? 2.2 : 1.3;
    roundRect(x, r.y + 10, r.w, r.h - 10, radius);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x + 8, r.y + 18);
    ctx.lineTo(x + r.w - 8, r.y + 18);
    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = "rgba(255,255,255,0.08)";
    roundRect(x + r.w * 0.18, r.y, r.w * 0.64, 16, 6);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.stroke();

    if (sealed && hideTop === 0) {
      ctx.save();
      ctx.shadowColor = "#e4c27a";
      ctx.shadowBlur = 14;
      ctx.fillStyle = "rgba(228,194,122,0.95)";
      roundRect(x + r.w * 0.12, r.y - 2, r.w * 0.76, 12, 4);
      ctx.fill();
      ctx.restore();
    }

    var run = topRun(jar);
    var dragging = drag && drag.active && drag.from === i;
    for (var n = 0; n < jar.length - hideTop; n++) {
      var inRun = n >= jar.length - run;
      if (dragging && inRun) continue;
      drawOrb(x + r.w / 2, slotY(r, n, orb), jar[n], orb, sel && inRun);
    }
    ctx.restore();
  }

  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  function drawFlying(now) {
    if (!anim) return;
    var orb = metrics.orb;
    var a = rects[anim.from], b = rects[anim.to];
    var done = true;
    for (var k = 0; k < anim.n; k++) {
      var delay = (anim.n - 1 - k) * 70;
      var t = Math.max(0, Math.min(1, (now - anim.t0 - delay) / anim.dur));
      if (t < 1) done = false;
      var e = ease(t);
      var sx = a.x + a.w / 2, sy = slotY(a, anim.srcLen + k, orb) - 6;
      var dx = b.x + b.w / 2, dy = slotY(b, anim.dstLen - anim.n + k, orb);
      var cy = Math.min(a.y, b.y) - orb * 2.2;
      var mx = (sx + dx) / 2;
      var x = (1 - e) * (1 - e) * sx + 2 * (1 - e) * e * mx + e * e * dx;
      var y = (1 - e) * (1 - e) * sy + 2 * (1 - e) * e * cy + e * e * dy;
      drawOrb(x, y, anim.color, orb, true);
    }
    if (done) finishPour(now);
  }

  function drawDrag() {
    if (!drag || !drag.active || selected === null) return;
    var jar = jars[selected];
    var orb = metrics.orb;
    var target = jarAt(drag.x, drag.y, 14);
    if (target !== null && target !== selected) {
      var r = rects[target];
      ctx.strokeStyle = "rgba(126,224,198,0.9)";
      ctx.lineWidth = 2.4;
      roundRect(r.x - 5, r.y - 6, r.w + 10, r.h + 12, r.w * 0.22);
      ctx.stroke();
    }
    var run = Math.min(topRun(jar), CAP);
    for (var k = run - 1; k >= 0; k--) drawOrb(drag.x, drag.y - orb * 1.4 - k * orb * 0.55, jar[jar.length - 1], orb, true);
  }

  function currentHint(now) {
    if (ended || anim || (drag && drag.active)) return null;
    if (now - lastInput < (moves === 0 ? 1200 : 5500)) return null;
    var res = solve(jars);
    if (!res || !res.move) return null;
    return { from: res.move[0], to: res.move[1] };
  }

  function drawHint(now, hint) {
    var target = selected === hint.from ? hint.to : hint.from;
    var r = rects[target];
    var phase = (((now - lastInput) % 1400) / 1400);
    var glow = 0.5 + 0.5 * Math.sin(phase * Math.PI * 2);
    var radius = Math.max(8, r.w * 0.2);
    ctx.save();
    ctx.shadowColor = "#e4c27a";
    ctx.shadowBlur = 10 + glow * 18;
    ctx.fillStyle = "rgba(228,194,122," + (0.06 + glow * 0.12) + ")";
    roundRect(r.x, r.y + 10, r.w, r.h - 10, radius);
    ctx.fill();
    ctx.restore();
    var size = Math.max(16, r.w * 0.32);
    var tip = Math.max(size * 0.6 + 10, r.y - 6) - Math.abs(Math.sin(now / 220)) * 10;
    drawChevron(r.x + r.w / 2, tip, size);
  }

  /** Game-styled marker above the jar to tap next. */
  function drawChevron(x, y, s) {
    ctx.save();
    ctx.shadowColor = "#e4c27a";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#ffd98a";
    ctx.beginPath();
    ctx.moveTo(x - s * 0.5, y - s * 0.55);
    ctx.lineTo(x, y);
    ctx.lineTo(x + s * 0.5, y - s * 0.55);
    ctx.lineTo(x + s * 0.28, y - s * 0.55);
    ctx.lineTo(x, y - s * 0.26);
    ctx.lineTo(x - s * 0.28, y - s * 0.55);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawFx(now) {
    particles = particles.filter(function (p) { return now - p.t0 < p.life; });
    particles.forEach(function (p) {
      var t = (now - p.t0) / p.life;
      ctx.globalAlpha = 1 - t;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x + p.vx * t * 60, p.y + p.vy * t * 60 + t * t * 40, p.r * (1 - t * 0.5), 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    popups = popups.filter(function (p) { return now - p.t0 < 1000; });
    popups.forEach(function (p) {
      var t = (now - p.t0) / 1000;
      ctx.globalAlpha = 1 - t;
      ctx.font = "800 " + Math.round(metrics.orb * 0.95 + 6) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.fillText(p.text, p.x, p.y - t * 34);
      ctx.shadowBlur = 0;
    });
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (w > 8 && h > 8) {
      if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      stars.forEach(function (st) {
        ctx.fillStyle = "rgba(255,255,255," + (0.08 + 0.12 * (0.5 + 0.5 * Math.sin(now / 900 + st.p))) + ")";
        ctx.beginPath();
        ctx.arc(st.x * w, st.y * h, st.r, 0, Math.PI * 2);
        ctx.fill();
      });
      metrics = layout(w, h);
      rects = metrics.rects;
      var hint = currentHint(now);
      for (var i = 0; i < jars.length; i++) {
        var hide = anim && anim.to === i ? anim.n : 0;
        drawJar(i, now, hint && (hint.from === i || hint.to === i), hide);
      }
      if (hint) drawHint(now, hint);
      drawFlying(now);
      drawDrag();
      drawFx(now);
    }
    requestAnimationFrame(frame);
  }

  // ---- game flow ----
  function setCaption(key) { $("caption").textContent = L[key]; }
  function refreshMoves() { $("moves").textContent = L.moves + moves; }

  function reset() {
    jars = clone(LEVEL);
    selected = null;
    anim = null;
    moves = 0;
    sealedCount = 0;
    combo = 0;
    ended = false;
    drag = null;
    hintCache = null;
    particles = [];
    popups = [];
    lastInput = performance.now();
    $("end").classList.add("hidden");
    setCaption("c0");
    refreshMoves();
  }

  function tryPour(a, b, now) {
    var n = amount(jars, a, b);
    if (!n) {
      var dst = jars[b];
      if (dst.length && !isSealed(dst)) {
        selected = b;
        return;
      }
      shake = { i: b, until: now + 320 };
      selected = null;
      return;
    }
    var color = jars[a][jars[a].length - 1];
    for (var t = 0; t < n; t++) jars[b].push(jars[a].pop());
    moves++;
    refreshMoves();
    selected = null;
    anim = { from: a, to: b, n: n, color: color, srcLen: jars[a].length, dstLen: jars[b].length, t0: now, dur: 360 };
    if (moves === 1) setCaption("c1");
  }

  function finishPour(now) {
    var to = anim.to;
    anim = null;
    var r = rects[to];
    if (isSealed(jars[to])) {
      sealedCount++;
      combo++;
      var color = COLORS[jars[to][0] - 1];
      for (var p = 0; p < 26; p++) {
        var ang = Math.random() * Math.PI * 2;
        var sp = 0.6 + Math.random() * 1.4;
        particles.push({ x: r.x + r.w / 2, y: r.y + r.h * 0.45, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.6, r: 2 + Math.random() * 2.5, color: Math.random() < 0.3 ? "#fff3c4" : color, t0: now, life: 650 + Math.random() * 350 });
      }
      popups.push({ x: r.x + r.w / 2, y: r.y - 10, text: combo >= 2 ? L.combo + combo : L.sealed, color: combo >= 2 ? "#7ee0c6" : "#e4c27a", t0: now });
      if (sealedCount === 1) setCaption("c2");
    } else {
      combo = 0;
    }
    if (isSolved(jars)) {
      ended = true;
      setTimeout(function () { showEnd(true); }, 950);
      return;
    }
    if (!solve(jars)) {
      ended = true;
      setTimeout(function () { showEnd(false); }, 700);
    }
  }

  function showEnd(win) {
    var starsN = moves <= OPTIMAL + 2 ? 3 : moves <= OPTIMAL + 6 ? 2 : 1;
    $("end-kicker").textContent = win ? L.winKicker : L.stuckKicker;
    $("end-stars").textContent = win ? "\u2605".repeat(starsN) + "\u2606".repeat(3 - starsN) : "";
    $("end-stars").style.display = win ? "block" : "none";
    $("end-title").textContent = win ? L.winTitle : L.stuckTitle;
    $("end-body").textContent = win ? L.winBody : L.stuckBody;
    $("again").textContent = win ? L.again : L.retry;
    $("end").classList.remove("hidden");
  }

  function point(ev) {
    var b = canvas.getBoundingClientRect();
    return { x: ev.clientX - b.left, y: ev.clientY - b.top };
  }

  canvas.addEventListener("pointerdown", function (ev) {
    var now = performance.now();
    lastInput = now;
    if (ended || anim || !rects) return;
    var p = point(ev);
    var hit = jarAt(p.x, p.y);
    drag = null;
    if (hit === null) { selected = null; return; }
    if (selected === null) {
      var jar = jars[hit];
      if (!jar.length || isSealed(jar)) { shake = { i: hit, until: now + 320 }; return; }
      selected = hit;
      drag = { from: hit, x0: p.x, y0: p.y, x: p.x, y: p.y, active: false, deselect: false };
    } else if (selected === hit) {
      drag = { from: hit, x0: p.x, y0: p.y, x: p.x, y: p.y, active: false, deselect: true };
    } else {
      tryPour(selected, hit, now);
    }
    if (drag) { try { canvas.setPointerCapture(ev.pointerId); } catch (e) { /* older WebViews */ } }
  });

  canvas.addEventListener("pointermove", function (ev) {
    if (!drag) return;
    var p = point(ev);
    drag.x = p.x;
    drag.y = p.y;
    if (!drag.active && Math.hypot(p.x - drag.x0, p.y - drag.y0) > 10) drag.active = true;
  });

  function endDrag(ev, cancel) {
    if (!drag) return;
    var d = drag;
    drag = null;
    lastInput = performance.now();
    if (cancel) return;
    if (!d.active) {
      if (d.deselect) selected = null;
      return;
    }
    var p = point(ev);
    var target = jarAt(p.x, p.y, 14);
    if (target !== null && target !== d.from && selected === d.from) tryPour(d.from, target, performance.now());
  }
  canvas.addEventListener("pointerup", function (ev) { endDrag(ev, false); });
  canvas.addEventListener("pointercancel", function (ev) { endDrag(ev, true); });

  $("cta-top").addEventListener("click", install);
  $("cta-end").addEventListener("click", install);
  $("restart").addEventListener("click", reset);
  $("again").addEventListener("click", reset);

  $("sub").textContent = L.sub;
  $("cta-top").textContent = L.install;
  $("cta-end").textContent = L.play;
  $("restart").textContent = L.restart;
  document.documentElement.lang = L === TEXT.vi ? "vi" : "en";

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
